<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шосткинский район и регионы</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0b172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
    
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .place-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .place-label.large {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.85)) drop-shadow(0px 0px 8px rgba(0, 0, 0, 0.6));
      z-index: 100;
    }

    .place-label.medium {
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2px;
      filter: drop-shadow(0px 1px 3px rgba(0, 0, 0, 0.85));
      z-index: 50;
    }

    .place-label.small {
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.9;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.9));
      z-index: 10;
    }

    .controls-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(11, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 310px;
      max-height: calc(100vh - 30px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-title {
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 8px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 11px;
      font-weight: 600;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .icon-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .objects-list-wrapper {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .objects-list-wrapper::-webkit-scrollbar {
      width: 4px;
    }
    .objects-list-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .object-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #f1f5f9;
      cursor: pointer;
      transition: background 0.15s ease;
      user-select: none;
    }

    .object-item:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .object-item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .object-item-info img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .object-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .batch-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: #ef4444;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-msg {
      color: #64748b;
      font-size: 11px;
      text-align: center;
      padding: 12px 0;
    }

    .screenshot-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
    }

    .control-btn.delete {
      background: #ef4444;
      color: white;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
    }

    .toast {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="controls-panel" id="ui-panel">
  <div class="panel-section">
    <div class="panel-title">Добавить объект</div>
    <div class="icons-grid">
      <button class="icon-btn" onclick="addIconMarker('зала.png', 'Зала')">
        <img src="icons/зала.png" alt="Зала"> Зала
      </button>
      <button class="icon-btn" onclick="addIconMarker('італмас.png', 'Італмас')">
        <img src="icons/італмас.png" alt="Італмас"> Італмас
      </button>
      <button class="icon-btn" onclick="addIconMarker('ланцет.png', 'Ланцет')">
        <img src="icons/ланцет.png" alt="Ланцет"> Ланцет
      </button>
      <button class="icon-btn" onclick="addIconMarker('молнія.png', 'Молнія')">
        <img src="icons/молнія.png" alt="Молнія"> Молнія
      </button>
      <button class="icon-btn" onclick="addIconMarker('невідомий.png', 'Невідомий')">
        <img src="icons/невідомий.png" alt="Невідомий"> Невідомий
      </button>
      <button class="icon-btn" onclick="addIconMarker('реактивний.png', 'Реактивний')">
        <img src="icons/реактивний.png" alt="Реактивний"> Реактивний
      </button>
      <button class="icon-btn" onclick="addIconMarker('розвіддрон.png', 'Розвіддрон')">
        <img src="icons/розвіддрон.png" alt="Розвіддрон"> Розвіддрон
      </button>
      <button class="icon-btn" onclick="addIconMarker('скам.png', 'Скам')">
        <img src="icons/скам.png" alt="Скам"> Скам
      </button>
      <button class="icon-btn" onclick="addIconMarker('фпв.png', 'ФПВ')">
        <img src="icons/фпв.png" alt="ФПВ"> ФПВ
      </button>
      <button class="icon-btn" onclick="addIconMarker('шахед.png', 'Шахед')">
        <img src="icons/шахед.png" alt="Шахед"> Шахед
      </button>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-title">Активные объекты (<span id="objects-count">0</span>)</div>
    
    <div class="batch-actions">
      <button class="btn-secondary" onclick="selectAllObjects(true)">Выбрать все</button>
      <button class="btn-secondary" onclick="selectAllObjects(false)">Снять выбор</button>
      <button class="btn-danger" onclick="deleteSelectedObjects()">Удалить выбранные</button>
    </div>

    <div class="objects-list-wrapper" id="objects-list">
      <div class="empty-msg">Нет активных объектов на карте</div>
    </div>
  </div>

  <button class="screenshot-btn" onclick="takeScreenshot()">
    Сделать скриншот
  </button>
</div>

<div id="toast" class="toast">Скриншот района скопирован в буфер обмена!</div>

<script>
  const SHOSTKA_CENTER = [33.4729, 51.8638];
  const TARGET_ZOOM = 9.3;

  let activeFeatures = [];
  let markerCounters = {};
  let loadedImages = new Set();
  let draggedFeatureId = null;
  let hoveredDroneId = null;

  const places = [
    // Основные города Шосткинского района
    { name: "Шостка", coords: [33.4729, 51.8638], size: "large" },
    { name: "Новгород-Сіверський", coords: [33.2796, 52.0040], size: "large" },
    { name: "Глухів", coords: [33.9148, 51.6787], size: "large" },
    { name: "Кролевець", coords: [33.3833, 51.5474], size: "large" },

    { name: "Середина-Буда", coords: [34.0288, 52.1849], size: "medium" },
    { name: "Зноб-Новгородське", coords: [33.6003, 52.2636], size: "medium" },
    { name: "Ямпіль", coords: [33.7802, 51.9453], size: "medium" },
    { name: "Свеса", coords: [33.9354, 51.9453], size: "medium" },
    { name: "Есмань", coords: [34.0659, 51.7673], size: "medium" },
    { name: "Шалигине", coords: [34.1002, 51.5739], size: "medium" },
    { name: "Вороніж", coords: [33.4781, 51.7755], size: "medium" },

    { name: "Уралове", coords: [33.5571, 52.1872], size: "small" },
    { name: "Очкине", coords: [33.3713, 52.2261], size: "small" },
    { name: "Слоут", coords: [33.7970, 51.7596], size: "small" },
    { name: "Богданівка", coords: [33.3325, 51.8954], size: "small" },
    { name: "Собич", coords: [33.2587, 51.8602], size: "small" },
    { name: "Пирогівка", coords: [33.2824, 51.9148], size: "small" },
    { name: "Тиманівка", coords: [33.1276, 51.7709], size: "small" },
    { name: "Клишки", coords: [33.3030, 51.7641], size: "small" },
    { name: "Степне", coords: [33.752664, 52.084731], size: "small" },
    { name: "Хутір-Михайлівський", coords: [33.899980, 52.045093], size: "medium" },
    { name: "Миронівка", coords: [33.555312, 51.904937], size: "small" },
    { name: "Береза", coords: [33.859720, 51.734766], size: "small" },
    { name: "Івот", coords: [33.486329, 51.983202], size: "small" },
    { name: "Каліївка", coords: [33.533156, 52.059774], size: "small" },
    { name: "Шатрище", coords: [33.684786, 52.026218], size: "small" },

    // Другие крупные города Сумской области
    { name: "Суми", coords: [34.79906498, 50.91740593], size: "large" },
    { name: "Чернігів", coords: [31.28655978, 51.50541414], size: "large" },
    { name: "Конотоп", coords: [33.20040213, 51.23250772], size: "large" },
    { name: "Охтирка", coords: [34.89467602, 50.30852254], size: "large" },
    { name: "Ромни", coords: [33.49520264, 50.74025149], size: "large" },
    { name: "Ніжин", coords: [31.88843512, 51.04772279], size: "large" },
    { name: "Прилуки", coords: [32.3923, 50.5843], size: "large" },
    { name: "Корюківка", coords: [32.2709, 51.7766], size: "medium" },
    { name: "Городня", coords: [31.5973, 51.8841], size: "medium" },
    { name: "Сновськ", coords: [31.9575, 51.8499], size: "medium" },
    { name: "Борзна", coords: [32.4411, 51.2527], size: "medium" },
    { name: "Мена", coords: [32.216667, 51.516667], size: "medium" },
    { name: "Короп", coords: [32.95575, 51.56265], size: "medium" },
    { name: "Буринь", coords: [33.83337859, 51.19935882], size: "medium" },
    { name: "Білопілля", coords: [34.31078602, 51.14747465], size: "medium" },
    { name: "Лебедин", coords: [34.48258115, 50.58227558], size: "medium" },

    // Сумская область — вне Шосткинского района
    { name: "Путивль", coords: [33.86884747, 51.33529242], size: "large" },
    { name: "Тростянець", coords: [34.965668, 50.484778], size: "large" },
    { name: "Краснопілля", coords: [35.256328, 50.773886], size: "medium" },
    { name: "Велика Писарівка", coords: [35.482992, 50.423354], size: "medium" },
    { name: "Ворожба", coords: [34.226649, 51.173162], size: "medium" },
    { name: "Терни", coords: [33.970697, 50.989163], size: "medium" },
    { name: "Миколаївка", coords: [34.373727, 50.941405], size: "medium" },
    { name: "Річки", coords: [34.49398832, 51.12226017], size: "small" },
    { name: "Старе Село", coords: [34.809338, 50.825996], size: "small" },
    { name: "Грун", coords: [34.0, 50.5], size: "small" },
    { name: "Попівка", coords: [33.11425821, 51.234291], size: "small" },
    { name: "Чернеччина", coords: [34.80883998, 50.3041151], size: "small" },
    { name: "Андріяшівка", coords: [33.518469, 50.515146], size: "small" },
    { name: "Безжівка", coords: [33.763451, 51.002981], size: "small" },
    { name: "Розсоші", coords: [35.443583, 50.335007], size: "small" },

    // Черниговская область — вне Шосткинского района
    { name: "Бахмач", coords: [32.783333, 51.183333], size: "large" },
    { name: "Бобровиця", coords: [31.382047, 50.745594], size: "medium" },
    { name: "Ічня", coords: [32.394, 50.862], size: "medium" },
    { name: "Носівка", coords: [31.581, 50.931], size: "medium" },
    { name: "Остер", coords: [30.883, 50.95], size: "medium" },
    { name: "Козелець", coords: [31.116667, 50.9], size: "medium" },
    { name: "Куликівка", coords: [31.643611, 51.374722], size: "small" },
    { name: "Сосниця", coords: [32.499722, 51.531111], size: "medium" },
    { name: "Варва", coords: [32.723611, 50.495], size: "medium" },
    { name: "Талалаївка", coords: [33.140833, 50.837222], size: "small" },
    { name: "Срібне", coords: [32.921667, 50.663056], size: "small" },
    { name: "Ріпки", coords: [31.083333, 51.8], size: "medium" },
    { name: "Десна", coords: [30.766667, 50.927778], size: "small" },
    { name: "Лосинівка", coords: [31.933333, 50.833333], size: "small" },
    { name: "Ладан", coords: [32.583333, 50.516667], size: "small" },
    { name: "Мала Дівиця", coords: [32.25, 50.55], size: "small" },
    { name: "Понорниця", coords: [32.716667, 51.666667], size: "small" },
    { name: "Добрянка", coords: [31.183333, 52.066667], size: "small" },
    { name: "Любеч", coords: [30.65, 51.7], size: "small" },
    { name: "Замглай", coords: [31.15, 51.833333], size: "small" },
    { name: "Седнів", coords: [31.566667, 51.65], size: "small" },
    { name: "Олишівка", coords: [31.333333, 51.216667], size: "small" },
    { name: "Михайло-Коцюбинське", coords: [31.083333, 51.466667], size: "small" },
    { name: "Дмитрівка", coords: [32.95, 51.083333], size: "small" },
    { name: "Парафіївка", coords: [32.65, 50.8], size: "small" }
  ];

  const map = new maplibregl.Map({
    container: 'map',
    preserveDrawingBuffer: true,
    style: {
      version: 8,
      sources: {
        'google-satellite': {
          type: 'raster',
          tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
          tileSize: 256
        }
      },
      layers: [
        {
          id: 'google-satellite-layer',
          type: 'raster',
          source: 'google-satellite',
          paint: {
            'raster-saturation': -0.3,
            'raster-brightness-max': 0.88
          }
        }
      ]
    },
    center: SHOSTKA_CENTER,
    zoom: TARGET_ZOOM
  });

  map.on('load', async () => {
    let ukraineGeojson = null;
    let ukraineRings = [];

    try {
      const res = await fetch('ukraine.geojson');
      ukraineGeojson = await res.json();
      
      const feature = ukraineGeojson.type === 'FeatureCollection' ? ukraineGeojson.features[0] : ukraineGeojson;
      
      if (feature.geometry.type === 'Polygon') {
        ukraineRings = feature.geometry.coordinates;
      } else if (feature.geometry.type === 'MultiPolygon') {
        feature.geometry.coordinates.forEach(poly => {
          ukraineRings.push(poly[0]);
        });
      }
    } catch(e) {
      console.error("Ошибка загрузки ukraine.geojson", e);
    }

    if (ukraineRings.length > 0) {
      const worldBox = [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]];
      const outsideMaskGeoJSON = {
        "type": "Feature",
        "geometry": {
          "type": "Polygon",
          "coordinates": [worldBox, ...ukraineRings]
        }
      };

      map.addSource('outside-mask-src', { type: 'geojson', data: outsideMaskGeoJSON });
      map.addLayer({
        'id': 'outside-mask-dimming',
        'type': 'fill',
        'source': 'outside-mask-src',
        'paint': {
          'fill-color': '#060d17',
          'fill-opacity': 0.75
        }
      });
    }

    map.addSource('ukraine-src', { type: 'geojson', data: ukraineGeojson || 'ukraine.geojson' });
    map.addSource('towns-src', { type: 'geojson', data: 'towns.geojson' });
    map.addSource('traca-src', { type: 'geojson', data: 'traca.geojson' });
    map.addSource('rayony-src', { type: 'geojson', data: 'rayony_ukrainy.geojson' });
    map.addSource('regions-src', { type: 'geojson', data: 'regions.geojson' });

    map.addLayer({
      'id': 'towns-fill',
      'type': 'fill',
      'source': 'towns-src',
      'paint': {
        'fill-color': '#868786',
        'fill-opacity': 0.45
      }
    });

    map.addLayer({
      'id': 'towns-outline',
      'type': 'line',
      'source': 'towns-src',
      'paint': {
        'line-color': '#868786',
        'line-width': 1.8,
        'line-opacity': 0.95
      }
    });

    map.addLayer({
      'id': 'traca-layer',
      'type': 'line',
      'source': 'traca-src',
      'paint': {
        'line-color': '#E5C158',
        'line-width': 1.6,
        'line-opacity': 0.85
      }
    });

    map.addLayer({
      'id': 'ukraine-border',
      'type': 'line',
      'source': 'ukraine-src',
      'paint': {
        'line-color': '#8FA396',
        'line-width': 1.5,
        'line-opacity': 0.8
      }
    });

    // Слой регионов (regions.geojson) — толщина 1.6px
    map.addLayer({
      'id': 'regions-border',
      'type': 'line',
      'source': 'regions-src',
      'paint': {
        'line-color': '#ffffff',
        'line-width': 1.6,
        'line-opacity': 0.85
      }
    });

    // Слой районов (rayony_ukrainy.geojson) — толщина 0.6px
    map.addLayer({
      'id': 'all-districts-border',
      'type': 'line',
      'source': 'rayony-src',
      'paint': {
        'line-color': '#ffffff',
        'line-width': 0.6,
        'line-opacity': 0.75
      }
    });

    map.addSource('drones-src', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: []
      }
    });

    map.addLayer({
      id: 'drones-layer',
      type: 'symbol',
      source: 'drones-src',
      layout: {
        'icon-image': ['get', 'iconImage'],
        'icon-size': 0.07,
        'icon-rotate': ['get', 'rotation'],
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'icon-pitch-alignment': 'map',
        'icon-rotation-alignment': 'map'
      }
    });

    places.forEach(place => {
      const el = document.createElement('div');
      el.className = `place-label ${place.size}`;
      el.innerText = place.name;
      new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(place.coords).addTo(map);
    });

    map.on('mousedown', 'drones-layer', (e) => {
      if (!e.features.length) return;
      draggedFeatureId = e.features[0].properties.id;
      map.getCanvas().style.cursor = 'grabbing';
      map.dragPan.disable();
    });

    map.on('mousemove', (e) => {
      if (draggedFeatureId) {
        const feat = activeFeatures.find(f => f.properties.id === draggedFeatureId);
        if (feat) {
          feat.geometry.coordinates = [e.lngLat.lng, e.lngLat.lat];
          updateGeoJSON();
        }
      }
    });

    map.on('mouseup', () => {
      if (draggedFeatureId) {
        draggedFeatureId = null;
        map.getCanvas().style.cursor = '';
        map.dragPan.enable();
      }
    });

    map.on('mouseenter', 'drones-layer', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      if (e.features.length > 0) {
        hoveredDroneId = e.features[0].properties.id;
      }
    });

    map.on('mouseleave', 'drones-layer', () => {
      if (!draggedFeatureId) map.getCanvas().style.cursor = '';
      hoveredDroneId = null;
    });

    window.addEventListener('keydown', (e) => {
      if (!hoveredDroneId) return;
      const key = e.key.toLowerCase();
      if (key === 'a' || key === 'd') {
        const feat = activeFeatures.find(f => f.properties.id === hoveredDroneId);
        if (feat) {
          const delta = (key === 'a') ? -5 : 5;
          feat.properties.rotation = (feat.properties.rotation || 0) + delta;
          updateGeoJSON();
        }
      }
    });

    const mapCanvas = map.getCanvasContainer();
    mapCanvas.addEventListener('wheel', (e) => {
      const point = [e.clientX, e.clientY];
      const bbox = [
        [point[0] - 15, point[1] - 15],
        [point[0] + 15, point[1] + 15]
      ];
      
      const features = map.queryRenderedFeatures(bbox, { layers: ['drones-layer'] });
      
      if (features.length > 0) {
        e.preventDefault();
        e.stopPropagation();

        const id = features[0].properties.id;
        const feat = activeFeatures.find(f => f.properties.id === id);
        
        if (feat) {
          const delta = Math.sign(e.deltaY);
          feat.properties.rotation = (feat.properties.rotation || 0) + delta * 5;
          updateGeoJSON();
        }
      }
    }, { passive: false, capture: true });
  });

  async function ensureImageLoaded(fileName) {
    if (loadedImages.has(fileName)) return;
    return new Promise((resolve) => {
      map.loadImage(`icons/${fileName}`, (error, image) => {
        if (!error && image) {
          if (!map.hasImage(fileName)) {
            map.addImage(fileName, image);
          }
          loadedImages.add(fileName);
        }
        resolve();
      });
    });
  }

  async function addIconMarker(fileName, typeName) {
    await ensureImageLoaded(fileName);

    const center = map.getCenter();
    const randomOffsetLng = (Math.random() - 0.5) * 0.01;
    const randomOffsetLat = (Math.random() - 0.5) * 0.01;

    markerCounters[typeName] = (markerCounters[typeName] || 0) + 1;
    const title = `${typeName} ${markerCounters[typeName]}`;
    const id = 'marker_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

    const newFeature = {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: [center.lng + randomOffsetLng, center.lat + randomOffsetLat]
      },
      properties: {
        id: id,
        title: title,
        fileName: fileName,
        iconImage: fileName,
        rotation: 0,
        checked: false
      }
    };

    activeFeatures.push(newFeature);
    updateGeoJSON();
    updateUIList();
  }

  function updateGeoJSON() {
    const source = map.getSource('drones-src');
    if (source) {
      source.setData({
        type: 'FeatureCollection',
        features: activeFeatures
      });
    }
  }

  function removeSingleMarker(id) {
    activeFeatures = activeFeatures.filter(f => f.properties.id !== id);
    updateGeoJSON();
    updateUIList();
  }

  function updateUIList() {
    const listContainer = document.getElementById('objects-list');
    const countContainer = document.getElementById('objects-count');
    
    countContainer.innerText = activeFeatures.length;
    listContainer.innerHTML = '';

    if (activeFeatures.length === 0) {
      listContainer.innerHTML = '<div class="empty-msg">Нет активных объектов на карте</div>';
      return;
    }

    activeFeatures.forEach(item => {
      const el = document.createElement('div');
      el.className = 'object-item';

      el.onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.classList.contains('delete')) return;
        map.flyTo({ center: item.geometry.coordinates, zoom: Math.max(map.getZoom(), 10), speed: 1.2 });
      };

      el.innerHTML = `
        <div class="object-item-info">
          <input type="checkbox" ${item.properties.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${item.properties.id}')">
          <img src="icons/${item.properties.fileName}" alt="icon">
          <span class="object-item-name">${item.properties.title}</span>
        </div>
        <div class="control-btn delete" onclick="event.stopPropagation(); removeSingleMarker('${item.properties.id}')">✕</div>
      `;

      listContainer.appendChild(el);
    });
  }

  function toggleCheck(id) {
    const item = activeFeatures.find(f => f.properties.id === id);
    if (item) {
      item.properties.checked = !item.properties.checked;
    }
  }

  function selectAllObjects(status) {
    activeFeatures.forEach(f => f.properties.checked = status);
    updateUIList();
  }

  function deleteSelectedObjects() {
    activeFeatures = activeFeatures.filter(f => !f.properties.checked);
    updateGeoJSON();
    updateUIList();
  }

  async function takeScreenshot() {
    const uiPanel = document.getElementById('ui-panel');
    uiPanel.style.display = 'none';

    map.jumpTo({ center: SHOSTKA_CENTER, zoom: TARGET_ZOOM, bearing: 0, pitch: 0 });
    await new Promise(resolve => setTimeout(resolve, 200));

    try {
      const mapCanvas = map.getCanvas();
      mapCanvas.toBlob(async (blob) => {
        if (blob) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          const toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        }
      }, 'image/png');
    } catch (e) {
      console.error(e);
    } finally {
      uiPanel.style.display = 'flex';
    }
  }
</script>
