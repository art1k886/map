<head>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background-color: #121212;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
    
    #map {
      position: absolute;
      top: 0; bottom: 0; width: 100%;
    }

    .place-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .place-label.large {
      color: #bbbbbb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      filter: drop-shadow(0px 1px 3px rgba(26, 26, 26, 0.95)) drop-shadow(0px 0px 6px rgba(26, 26, 26, 0.9));
      z-index: 100;
    }

    .place-label.medium {
      color: #bbbbbb;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2px;
      filter: drop-shadow(0px 1px 3px rgba(26, 26, 26, 0.95));
      z-index: 50;
    }

    .place-label.small {
      color: #bbbbbb;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.9;
      filter: drop-shadow(0px 1px 2px rgba(26, 26, 26, 0.95));
      z-index: 10;
    }

    .controls-panel {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 280px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .controls-panel::-webkit-scrollbar { width: 4px; }
    .controls-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-title {
      color: #38bdf8;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 5px 6px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 10px;
      font-weight: 600;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .icon-btn img {
      width: 16px; height: 16px;
      object-fit: contain;
    }

    .objects-list-wrapper {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px;
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .objects-list-wrapper::-webkit-scrollbar { width: 3px; }
    .objects-list-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .object-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px 6px;
      border-radius: 5px;
      font-size: 10px;
      color: #f1f5f9;
      cursor: pointer;
      transition: background 0.15s ease;
      user-select: none;
    }

    .object-item:hover { background: rgba(56, 189, 248, 0.2); }

    .object-item-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .object-item-info img {
      width: 16px; height: 16px;
      object-fit: contain;
    }

    .object-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .batch-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: space-between;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: #ef4444;
      border: none;
      color: white;
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-msg {
      color: #64748b;
      font-size: 10px;
      text-align: center;
      padding: 8px 0;
    }

    #screenshot-selection-layer {
      position: fixed;
      inset: 0;
      z-index: 5000;
      cursor: crosshair;
      background: rgba(5, 10, 20, 0.08);
      user-select: none;
      touch-action: none;
    }
    #screenshot-selection-rect {
      position: fixed;
      border: 2px solid #60a5fa;
      background: rgba(96, 165, 250, 0.12);
      box-shadow: 0 0 0 99999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      display: none;
    }
    #screenshot-selection-hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.92);
      color: #f1f5f9;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      font: 600 12px 'Plus Jakarta Sans', sans-serif;
      pointer-events: none;
      white-space: nowrap;
    }

    .screenshot-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 10px;
    }

    .control-btn.delete {
      background: #ef4444;
      color: white;
      border: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 9px;
      font-weight: bold;
    }

    .toast {
      position: absolute;
      bottom: 25px; left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .toast.show { opacity: 1; }

    /* ===== Настройки ===== */
    .settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1100;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .settings-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: scale(1.05);
    }
    .settings-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.4s ease;
    }
    .settings-btn.active svg {
      transform: rotate(90deg);
      stroke: #38bdf8;
    }

    .settings-menu {
      position: absolute;
      top: 56px;
      right: 10px;
      z-index: 1099;
      background: rgba(18, 18, 18, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 240px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .settings-menu.open {
      display: flex;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .settings-label {
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
    }
    .settings-label small {
      display: block;
      color: #64748b;
      font-size: 9px;
      font-weight: 500;
      margin-top: 1px;
    }

    /* Тумблер */
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: #e2e8f0;
      border-radius: 50%;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .toggle input:checked + .slider {
      background: #2563eb;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(16px);
      background: #ffffff;
    }
  </style>
</head>

        }
      ]
    },
    center: SHOSTKA_CENTER,
    zoom: TARGET_ZOOM
  });

  map.on('load', async () => {
    let ukraineGeojson = null;
    let ukraineRings = [];

    try {
      const res = await fetch('ukraine.geojson');
      ukraineGeojson = await res.json();
      
      const feature = ukraineGeojson.type === 'FeatureCollection' ? ukraineGeojson.features[0] : ukraineGeojson;
      
      if (feature.geometry.type === 'Polygon') {
        ukraineRings = feature.geometry.coordinates;
      } else if (feature.geometry.type === 'MultiPolygon') {
        feature.geometry.coordinates.forEach(poly => {
          ukraineRings.push(poly[0]);
        });
      }
    } catch(e) {
      console.error("Ошибка загрузки ukraine.geojson", e);
    }

    if (ukraineRings.length > 0) {
      const worldBox = [[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]];
      const outsideMaskGeoJSON = {
        "type": "Feature",
        "geometry": {
          "type": "Polygon",
          "coordinates": [worldBox, ...ukraineRings]
        }
      };

      map.addSource('outside-mask-src', { type: 'geojson', data: outsideMaskGeoJSON });
      map.addLayer({
        'id': 'outside-mask-dimming',
        'type': 'fill',
        'source': 'outside-mask-src',
        'paint': {
          'fill-color': '#1a1a1a',
          'fill-opacity': 0.70
        }
      });
    }

    map.addSource('ukraine-src', { type: 'geojson', data: ukraineGeojson || 'ukraine.geojson' });
    map.addSource('towns-src', { type: 'geojson', data: 'towns.geojson' });
    map.addSource('traca-src', { type: 'geojson', data: 'traca.geojson' });
    map.addSource('rayony-src', { type: 'geojson', data: 'rayony_ukrainy.geojson' });
    map.addSource('regions-src', { type: 'geojson', data: 'regions.geojson' });

    map.addLayer({
      'id': 'ukraine-tint',
      'type': 'fill',
      'source': 'ukraine-src',
      'paint': {
        'fill-color': '#ffffff',
        'fill-opacity': 0.05
      }
    });

    map.addLayer({
      'id': 'towns-fill',
      'type': 'fill',
      'source': 'towns-src',
      'paint': {
        'fill-color': '#dddddd',
        'fill-opacity': 0.95
      }
    });

    map.addLayer({
      'id': 'towns-outline',
      'type': 'line',
      'source': 'towns-src',
      'paint': {
        'line-color': '#dddddd',
        'line-width': 1.0,
        'line-opacity': 0.9
      }
    });

    map.addLayer({
      'id': 'traca-layer',
      'type': 'line',
      'source': 'traca-src',
      'paint': {
        'line-color': '#b8731d',
        'line-width': 1.6,
        'line-opacity': 0.85
      }
    });

    map.addLayer({
      'id': 'ukraine-border',
      'type': 'line',
      'source': 'ukraine-src',
      'paint': {
        'line-color': '#787878',
        'line-width': 2.5,
        'line-opacity': 1.0
      }
    });

    map.addLayer({
      'id': 'regions-border',
      'type': 'line',
      'source': 'regions-src',
      'paint': {
        'line-color': '#787878',
        'line-width': 1.5,
        'line-opacity': 0.8
      }
    });

    map.addLayer({
      'id': 'all-districts-border',
      'type': 'line',
      'source': 'rayony-src',
      'paint': {
        'line-color': '#787878',
        'line-width': 0.6,
        'line-opacity': 0.6
      }
    });

    // ===== Слой подписей Н.П. из векторного источника =====
    map.addLayer({
      id: 'place-labels',
      type: 'symbol',
      source: 'openmaptiles',
      'source-layer': 'place',
      filter: [
        'all',
        ['==', ['geometry-type'], 'Point'],
        ['in', ['get', 'class'], ['literal', ['city', 'town', 'village', 'hamlet']]],
        ['has', 'name:uk']
      ],
      layout: {
        'text-field': ['get', 'name:uk'],
        'text-font': ['Noto Sans Regular'],
        'text-size': [
          'interpolate', ['linear'], ['zoom'],
          4, 9,
          6, 10,
          8, 11,
          10, 12,
          12, 13
        ],
        'text-anchor': 'center',
        'text-allow-overlap': false,
        'text-ignore-placement': false,
        'text-padding': 2,
        'text-max-width': 8
      },
      paint: {
        'text-color': '#bbbbbb',
        'text-halo-width': 0
      },
      minzoom: 5,
      maxzoom: 14
    });

    // Изначально слой скрыт
    map.setLayoutProperty('place-labels', 'visibility', 'none');

    map.addSource('drones-src', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: []
      }
    });

    map.addLayer({
      id: 'drones-layer',
      type: 'symbol',
      source: 'drones-src',
      layout: {
        'icon-image': ['get', 'iconImage'],
        'icon-size': 0.07,
        'icon-rotate': ['get', 'rotation'],
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'icon-pitch-alignment': 'map',
        'icon-rotation-alignment': 'map'
      }
    });

    // Сохраняем кастомные маркеры
    places.forEach(place => {
      const el = document.createElement('div');
      el.className = `place-label ${place.size}`;
      el.innerText = place.name;
      const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(place.coords).addTo(map);
      customPlaceMarkers.push(marker);
    });

    map.on('mousedown', 'drones-layer', (e) => {
      if (!e.features.length) return;
      draggedFeatureId = e.features[0].properties.id;
      map.getCanvas().style.cursor = 'grabbing';
      map.dragPan.disable();
    });

    map.on('mousemove', (e) => {
      if (draggedFeatureId) {
        const feat = activeFeatures.find(f => f.properties.id === draggedFeatureId);
        if (feat) {
          feat.geometry.coordinates = [e.lngLat.lng, e.lngLat.lat];
          updateGeoJSON();
        }
      }
    });

    map.on('mouseup', () => {
      if (draggedFeatureId) {
        draggedFeatureId = null;
        map.getCanvas().style.cursor = '';
        map.dragPan.enable();
      }
    });

    map.on('mouseenter', 'drones-layer', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      if (e.features.length > 0) {
        hoveredDroneId = e.features[0].properties.id;
      }
    });

    map.on('mouseleave', 'drones-layer', () => {
      if (!draggedFeatureId) map.getCanvas().style.cursor = '';
      hoveredDroneId = null;
    });

    window.addEventListener('keydown', (e) => {
      if (!hoveredDroneId) return;
      const key = e.key.toLowerCase();
      if (key === 'a' || key === 'd') {
        const feat = activeFeatures.find(f => f.properties.id === hoveredDroneId);
        if (feat) {
          const delta = (key === 'a') ? -5 : 5;
          feat.properties.rotation = (feat.properties.rotation || 0) + delta;
          updateGeoJSON();
        }
      }
    });

    const mapCanvas = map.getCanvasContainer();
    mapCanvas.addEventListener('wheel', (e) => {
      const point = [e.clientX, e.clientY];
      const bbox = [
        [point[0] - 15, point[1] - 15],
        [point[0] + 15, point[1] + 15]
      ];
      
      const features = map.queryRenderedFeatures(bbox, { layers: ['drones-layer'] });
      
      if (features.length > 0) {
        e.preventDefault();
        e.stopPropagation();

        const id = features[0].properties.id;
        const feat = activeFeatures.find(f => f.properties.id === id);
        
        if (feat) {
          const delta = Math.sign(e.deltaY);
          feat.properties.rotation = (feat.properties.rotation || 0) + delta * 5;
          updateGeoJSON();
        }
      }
    }, { passive: false, capture: true });

    // ===== Обработка тумблера =====
    const toggleMapLabels = document.getElementById('toggle-map-labels');
    toggleMapLabels.addEventListener('change', () => {
      const showMapLabels = toggleMapLabels.checked;
      if (showMapLabels) {
        // Скрыть кастомные
        customPlaceMarkers.forEach(m => m.remove());
        // Показать слой с карты
        map.setLayoutProperty('place-labels', 'visibility', 'visible');
      } else {
        // Показать кастомные
        customPlaceMarkers.forEach(m => {
          m.addTo(map);
        });
        // Скрыть слой с карты
        map.setLayoutProperty('place-labels', 'visibility', 'none');
      }
    });
  });

  async function ensureImageLoaded(fileName) {
    if (loadedImages.has(fileName)) return;
    return new Promise((resolve) => {
      map.loadImage(`icons/${fileName}`, (error, image) => {
        if (!error && image) {
          if (!map.hasImage(fileName)) {
            map.addImage(fileName, image);
          }
          loadedImages.add(fileName);
        }
        resolve();
      });
    });
  }

  async function addIconMarker(fileName, typeName) {
    await ensureImageLoaded(fileName);

    const center = map.getCenter();
    const randomOffsetLng = (Math.random() - 0.5) * 0.01;
    const randomOffsetLat = (Math.random() - 0.5) * 0.01;

    markerCounters[typeName] = (markerCounters[typeName] || 0) + 1;
    const title = `${typeName} ${markerCounters[typeName]}`;
    const id = 'marker_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

    const newFeature = {
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: [center.lng + randomOffsetLng, center.lat + randomOffsetLat]
      },
      properties: {
        id: id,
        title: title,
        fileName: fileName,
        iconImage: fileName,
        rotation: 0,
        checked: false
      }
    };

    activeFeatures.push(newFeature);
    updateGeoJSON();
    updateUIList();
  }

  function updateGeoJSON() {
    const source = map.getSource('drones-src');
    if (source) {
      source.setData({
        type: 'FeatureCollection',
        features: activeFeatures
      });
    }
  }

  function removeSingleMarker(id) {
    activeFeatures = activeFeatures.filter(f => f.properties.id !== id);
    updateGeoJSON();
    updateUIList();
  }

  function updateUIList() {
    const listContainer = document.getElementById('objects-list');
    const countContainer = document.getElementById('objects-count');
    
    countContainer.innerText = activeFeatures.length;
    listContainer.innerHTML = '';

    if (activeFeatures.length === 0) {
      listContainer.innerHTML = '<div class="empty-msg">Нет активных объектов на карте</div>';
      return;
    }

    activeFeatures.forEach(item => {
      const el = document.createElement('div');
      el.className = 'object-item';

      el.onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.classList.contains('delete')) return;
        map.flyTo({ center: item.geometry.coordinates, zoom: Math.max(map.getZoom(), 10), speed: 1.2 });
      };

      el.innerHTML = `
        <div class="object-item-info">
          <input type="checkbox" ${item.properties.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${item.properties.id}')">
          <img src="icons/${item.properties.fileName}" alt="icon">
          <span class="object-item-name">${item.properties.title}</span>
        </div>
        <div class="control-btn delete" onclick="event.stopPropagation(); removeSingleMarker('${item.properties.id}')">✕</div>
      `;

      listContainer.appendChild(el);
    });
  }

  function toggleCheck(id) {
    const item = activeFeatures.find(f => f.properties.id === id);
    if (item) {
      item.properties.checked = !item.properties.checked;
    }
  }

  function selectAllObjects(status) {
    activeFeatures.forEach(f => f.properties.checked = status);
    updateUIList();
  }

  function deleteSelectedObjects() {
    activeFeatures = activeFeatures.filter(f => !f.properties.checked);
    updateGeoJSON();
    updateUIList();
  }

  async function takeScreenshot() {
    if (document.getElementById('screenshot-selection-layer')) return;

    const uiPanel = document.getElementById('ui-panel');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsMenu = document.getElementById('settings-menu');
    const toast = document.getElementById('toast');
    const oldPanelDisplay = uiPanel.style.display;
    const oldSettingsBtnDisplay = settingsBtn.style.display;
    const oldSettingsMenuDisplay = settingsMenu.style.display;
    const labelToggle = document.getElementById('toggle-map-labels');
    const oldMapLabelsVisibility = map.getLayoutProperty('place-labels', 'visibility');

    // Убираем интерфейс на время выбора, но не меняем положение/масштаб карты.
    uiPanel.style.display = 'none';
    settingsBtn.style.display = 'none';
    settingsMenu.style.display = 'none';

    const layer = document.createElement('div');
    layer.id = 'screenshot-selection-layer';
    const rect = document.createElement('div');
    rect.id = 'screenshot-selection-rect';
    const hint = document.createElement('div');
    hint.id = 'screenshot-selection-hint';
    hint.textContent = 'Зажми ЛКМ и выдели область • Esc — отмена';
    layer.append(rect, hint);
    document.body.appendChild(layer);

    let startX = 0, startY = 0, currentX = 0, currentY = 0;
    let dragging = false;
    let finished = false;

    const restoreUi = () => {
      layer.remove();
      uiPanel.style.display = oldPanelDisplay;
      settingsBtn.style.display = oldSettingsBtnDisplay;
      settingsMenu.style.display = oldSettingsMenuDisplay;
      map.setLayoutProperty('place-labels', 'visibility', oldMapLabelsVisibility || 'none');
    };

    const drawRect = () => {
      const left = Math.min(startX, currentX);
      const top = Math.min(startY, currentY);
      rect.style.left = `${left}px`;
      rect.style.top = `${top}px`;
      rect.style.width = `${Math.abs(currentX - startX)}px`;
      rect.style.height = `${Math.abs(currentY - startY)}px`;
      rect.style.display = 'block';
    };

    const onKeyDown = (e) => {
      if (e.key === 'Escape' && !finished) {
        finished = true;
        cleanupListeners();
        restoreUi();
      }
    };
    const cleanupListeners = () => {
      layer.removeEventListener('pointerdown', onPointerDown);
      layer.removeEventListener('pointermove', onPointerMove);
      layer.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('keydown', onKeyDown);
    };
    const onPointerDown = (e) => {
      if (e.button !== 0 || finished) return;
      e.preventDefault();
      dragging = true;
      startX = currentX = e.clientX;
      startY = currentY = e.clientY;
      drawRect();
    };
    const onPointerMove = (e) => {
      if (!dragging || finished) return;
      currentX = e.clientX;
      currentY = e.clientY;
      drawRect();
    };
    const onPointerUp = async (e) => {
      if (!dragging || finished || e.button !== 0) return;
      dragging = false;
      currentX = e.clientX;
      currentY = e.clientY;
      drawRect();
      finished = true;
      cleanupListeners();

      const left = Math.max(0, Math.min(startX, currentX));
      const top = Math.max(0, Math.min(startY, currentY));
      const width = Math.min(window.innerWidth, Math.max(startX, currentX)) - left;
      const height = Math.min(window.innerHeight, Math.max(startY, currentY)) - top;
      if (width < 12 || height < 12) {
        restoreUi();
        return;
      }

      let originalPixelRatio = null;
      let highResolutionRenderEnabled = false;
      try {
        // Перерисовываем карту в повышенном pixel ratio ДО захвата, а не растягиваем
        // маленький готовый кадр. Это повышает чёткость векторных объектов и подписей.
        map.setLayoutProperty('place-labels', 'visibility', 'none');
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const initialCanvas = map.getCanvas();
        const initialRect = initialCanvas.getBoundingClientRect();
        originalPixelRatio = initialCanvas.width / Math.max(1, initialRect.width);
        const scale = Math.min(4, 3840 / Math.max(width, height));

        // Ограничиваем размер WebGL canvas, чтобы не упереться в лимит видеокарты.
        // На большинстве компьютеров это позволяет рендерить всю карту минимум в 2x,
        // а выделенную область сохранять до 3840 px по длинной стороне.
        if (typeof map.setPixelRatio === 'function') {
          const maxCanvasSide = 8192;
          const safeRatio = Math.min(
            Math.max(originalPixelRatio, scale),
            maxCanvasSide / Math.max(1, initialRect.width),
            maxCanvasSide / Math.max(1, initialRect.height)
          );
          if (safeRatio > originalPixelRatio + 0.01) {
            map.setPixelRatio(safeRatio);
            highResolutionRenderEnabled = true;
            map.resize();
            await new Promise(resolve => {
              let done = false;
              const finish = () => { if (!done) { done = true; map.off('idle', finish); resolve(); } };
              map.once('idle', finish);
              setTimeout(finish, 1800);
              map.triggerRepaint();
            });
          }
        }
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const mapCanvas = map.getCanvas();
        const canvasRect = mapCanvas.getBoundingClientRect();
        const dprX = mapCanvas.width / Math.max(1, canvasRect.width);
        const dprY = mapCanvas.height / Math.max(1, canvasRect.height);
        const sx = Math.max(0, Math.round((left - canvasRect.left) * dprX));
        const sy = Math.max(0, Math.round((top - canvasRect.top) * dprY));
        const sw = Math.max(1, Math.min(Math.round(width * dprX), mapCanvas.width - sx));
        const sh = Math.max(1, Math.min(Math.round(height * dprY), mapCanvas.height - sy));
        const out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(width * scale));
        out.height = Math.max(1, Math.round(height * scale));
        const ctx = out.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(mapCanvas, sx, sy, sw, sh, 0, 0, out.width, out.height);

        // Всегда используем кастомные названия Н.П., независимо от положения переключателя.
        ctx.save();
        ctx.scale(scale, scale);
        places.forEach(place => {
          const point = map.project(place.coords);
          const x = point.x + canvasRect.left - left;
          const y = point.y + canvasRect.top - top;
          if (x < -180 || y < -30 || x > width + 180 || y > height + 30) return;
          let fontSize = 10, weight = 600, letterSpacing = 0, shadowBlur = 2;
          if (place.size === 'large') { fontSize = 13; weight = 800; letterSpacing = 0.4; shadowBlur = 6; }
          else if (place.size === 'medium') { fontSize = 11; weight = 700; letterSpacing = 0.2; shadowBlur = 3; }
          ctx.font = `${weight} ${fontSize}px "Plus Jakarta Sans", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#bbbbbb';
          ctx.shadowColor = 'rgba(26,26,26,0.95)';
          ctx.shadowBlur = shadowBlur;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 1;
          if ('letterSpacing' in ctx) ctx.letterSpacing = `${letterSpacing}px`;
          ctx.fillText(place.name, x, y);
        });
        ctx.restore();

        const blob = await new Promise(resolve => out.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('Не удалось сформировать PNG');
        let copied = false;
        if (navigator.clipboard && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            copied = true;
          } catch (err) {
            console.warn('Не удалось скопировать изображение, будет скачивание:', err);
          }
        }
        if (!copied) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `map-screenshot-${out.width}x${out.height}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        }
        toast.textContent = copied
          ? `Скриншот ${out.width}×${out.height} скопирован в буфер обмена`
          : `Скриншот ${out.width}×${out.height} сохранён в PNG`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      } catch (err) {
        console.error('Ошибка скриншота:', err);
        toast.textContent = 'Не удалось сделать скриншот. Попробуй ещё раз.';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      } finally {
        // Возвращаем обычную производительность карты после скриншота.
        if (highResolutionRenderEnabled && originalPixelRatio !== null && typeof map.setPixelRatio === 'function') {
          try {
            map.setPixelRatio(originalPixelRatio);
            map.resize();
            map.triggerRepaint();
          } catch (restoreError) {
            console.warn('Не удалось вернуть исходное разрешение карты:', restoreError);
          }
        }
        restoreUi();
      }
    };

    layer.addEventListener('pointerdown', onPointerDown);
    layer.addEventListener('pointermove', onPointerMove);
    layer.addEventListener('pointerup', onPointerUp);
    document.addEventListener('keydown', onKeyDown);
  }

  // ===== Настройки: открытие/закрытие меню =====
  const settingsBtn = document.getElementById('settings-btn');
  const settingsMenu = document.getElementById('settings-menu');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsBtn.classList.toggle('active');
    settingsMenu.classList.toggle('open');
  });

  // Закрытие при клике вне меню
  document.addEventListener('click', (e) => {
    if (!settingsMenu.contains(e.target) && !settingsBtn.contains(e.target)) {
      settingsMenu.classList.remove('open');
      settingsBtn.classList.remove('active');
    }
  });
</script>

</body>
